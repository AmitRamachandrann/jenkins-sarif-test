apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Trivy Scanner
on:
  push:
    branches:
      - sha-trivy-1

jobs:
  binary-upload:
    permissions:
      id-token: write
      contents: read  

    steps:
      - name: Checkout source code
        uses: cloudbees-io/checkout@v1

      - name: Setup git credentials
        uses: cloudbees-io/configure-git-global-credentials@v1

      - name: Login to AWS
        uses: cloudbees-io/configure-aws-credentials@v1
        id: aws-login
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.oidc_staging_iam_role }}
          role-duration-seconds: "3600" # optionally set the duration of the login token

      - name: Configure container registry for AWS ECR
        uses: cloudbees-io/configure-ecr-credentials@v1

      - name: build the docker image and create a tar file
        uses: cloudbees-io/kaniko@v1
        with:
          destination: 020229604682.dkr.ecr.us-east-1.amazonaws.com/throwaway/actions/vulnerable-image:trivy-sarif-jenkins-test
          tar-path: container-image.tar

     
     
